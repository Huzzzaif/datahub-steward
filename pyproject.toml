[project]
name = "steward"
version = "0.1.0"
description = "DataHub agents whose findings compound in the catalog"
readme = "README.md"
authors = [
    { name = "huzzzaif", email = "huzaiffkhhan@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
# Base install runs the crews, the web demo and the whole test suite. It
# deliberately excludes the DataHub SDK: the hosted demo uses the in-memory
# catalog, and acryl-datahub is the overwhelming majority of the image size —
# shipping it to a free dyno that never imports it just slows down cold starts.
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.52.1",
]

[project.optional-dependencies]
# Needed to talk to a real DataHub: `steward seed`, `steward parity`,
# `steward serve --datahub`.
datahub = ["acryl-datahub>=1.7"]
# Needed only for STEWARD_PROVIDER=anthropic. Ollama and Groq are plain HTTP.
anthropic = ["anthropic>=0.121.0"]
all = ["acryl-datahub>=1.7", "anthropic>=0.121.0"]

[project.scripts]
steward = "steward.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # The new datahub.sdk package warns on import; we deliberately don't use it.
    "ignore::UserWarning:datahub.*",
]
